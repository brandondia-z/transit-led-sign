<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMATA Sign Wi-Fi Setup</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .wifi-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            background: #111;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            padding: 8px;
        }
        .wifi-item {
            padding: 12px;
            background: #1a1a1a;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .wifi-item:hover, .wifi-item.selected {
            background: #2a2a2a;
        }
        .wifi-item .check {
            display: none;
            color: #64D2C9;
            font-size: 16px;
        }
        .wifi-item.selected .check {
            display: block;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        #errorMsg {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        #successMsg {
            color: #0FAB4B;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="accordion-header">
            <span>WI-FI SETUP</span>
        </div>

        <div class="accordion-content" id="setupContent">
            <p style="font-size: 13px; color: #aaa;">Select your home network and enter the password.</p>
            
            <div id="wifiList" class="wifi-list">
                <div class="loading">Scanning for networks...</div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>PASSWORD</label>
                <input type="password" id="wifiPassword" placeholder="Enter network password">
                <div id="errorMsg">Incorrect password or out of range.</div>
            </div>

            <button class="save-btn" id="connectBtn" disabled>Connect to Wi-Fi</button>
        </div>
        
        <div class="accordion-content" id="successContent" style="display: none; align-items: center; justify-content: center; min-height: 200px;">
            <div id="successMsg">Success! The sign is now online.<br><br>You can close this page.</div>
        </div>
    </div>

    <script>
        let selectedSsid = null;
        const wifiList = document.getElementById('wifiList');
        const connectBtn = document.getElementById('connectBtn');
        const passwordInput = document.getElementById('wifiPassword');
        const errorMsg = document.getElementById('errorMsg');
        const setupContent = document.getElementById('setupContent');
        const successContent = document.getElementById('successContent');
        const successMsg = document.getElementById('successMsg');

        // Fetch networks
        fetch('/api/wifi/scan')
            .then(res => res.json())
            .then(networks => {
                wifiList.innerHTML = '';
                if (networks.length === 0) {
                    wifiList.innerHTML = '<div class="loading">No networks found. Refresh the page.</div>';
                    return;
                }
                networks.forEach(ssid => {
                    const div = document.createElement('div');
                    div.className = 'wifi-item';
                    div.innerHTML = `<span>${ssid}</span><span class="check">✓</span>`;
                    div.onclick = () => {
                        document.querySelectorAll('.wifi-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedSsid = ssid;
                        connectBtn.disabled = false;
                        errorMsg.style.display = 'none';
                        connectBtn.style.backgroundColor = '#64D2C9';
                        connectBtn.textContent = 'Connect to Wi-Fi';
                    };
                    wifiList.appendChild(div);
                });
            })
            .catch(err => {
                wifiList.innerHTML = '<div class="loading">Failed to scan networks.</div>';
            });

        connectBtn.onclick = () => {
            if (!selectedSsid) return;
            const password = passwordInput.value;
            connectBtn.textContent = 'Connecting...';
            connectBtn.disabled = true;
            errorMsg.style.display = 'none';

            fetch('/api/wifi/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ssid: selectedSsid, password: password })
            }).then(res => {
                if (!res.ok) {
                    return res.json().then(data => { throw new Error(data.error); });
                }
                return res.json();
            }).then(data => {
                // If we get here, it succeeded but the network didn't drop fast enough to cause a timeout
                showSuccess();
            }).catch(err => {
                // A TypeError or network error usually means the hotspot dropped (which means success!)
                if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    showSuccess();
                } else {
                    // Actual API error (e.g. 400 Incorrect Password)
                    errorMsg.textContent = err.message || "Incorrect password or network out of range.";
                    errorMsg.style.display = 'block';
                    connectBtn.textContent = 'Try Again';
                    connectBtn.style.backgroundColor = '#E51636'; // Red
                    connectBtn.disabled = false;
                }
            });
        };
        
        function showSuccess() {
            setupContent.style.display = 'none';
            successContent.style.display = 'flex';
            successMsg.style.display = 'block';
        }
    </script>
</body>
</html>
