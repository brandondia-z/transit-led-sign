<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WMATA Sign Config</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #f68712; }
        h2 { font-size: 18px; color: #aaa; margin-top: 0; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #00B140; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .success { color: #00B140; margin-top: 10px; display: none; }
        .error { color: #E51636; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<h1>WMATA Arrival Sign</h1>

<div class="card" id="settings-card">
    <h2>Display Settings</h2>
    <label>Station Code(s) (Comma separated)</label>
    <input type="text" id="station_codes" value="{{ settings.get('STATION_CODES', 'A01,C01') }}" placeholder="e.g. A01,C01">
    
    <label>Direction Filter</label>
    <select id="direction_group">
        <option value="all" {% if settings.get('DIRECTION_GROUP') == 'all' %}selected{% endif %}>All Directions</option>
        <option value="1" {% if settings.get('DIRECTION_GROUP') == '1' %}selected{% endif %}>Group 1 (East/North)</option>
        <option value="2" {% if settings.get('DIRECTION_GROUP') == '2' %}selected{% endif %}>Group 2 (West/South)</option>
    </select>

    <label>Display Mode</label>
    <select id="display_mode">
        <option value="transit" {% if settings.get('DISPLAY_MODE') == 'transit' %}selected{% endif %}>Live Transit</option>
        <option value="clock" {% if settings.get('DISPLAY_MODE') == 'clock' %}selected{% endif %}>Clock</option>
    </select>

    <label>Brightness (1-50)</label>
    <input type="number" id="brightness" min="1" max="50" value="{{ settings.get('BRIGHTNESS', '40') }}">

    <button onclick="saveSettings()">Save Settings</button>
    <div id="settings-msg" class="success">Settings saved!</div>
</div>

<div class="card" id="wifi-card">
    <h2>Wi-Fi Connection</h2>
    <label>Available Networks</label>
    <select id="ssid">
        {% for net in networks %}
        <option value="{{ net.ssid }}">{{ net.ssid }} ({{ net.signal }}%)</option>
        {% endfor %}
    </select>
    
    <label>Password</label>
    <input type="password" id="password" placeholder="Leave blank if open">

    <button onclick="connectWifi()">Connect Wi-Fi</button>
    <div id="wifi-msg"></div>
</div>

<script>
async function saveSettings() {
    const data = {
        station_codes: document.getElementById('station_codes').value,
        direction_group: document.getElementById('direction_group').value,
        display_mode: document.getElementById('display_mode').value,
        brightness: document.getElementById('brightness').value
    };
    
    const res = await fetch('/api/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    const msg = document.getElementById('settings-msg');
    if (res.ok) {
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
    }
}

async function connectWifi() {
    const data = {
        ssid: document.getElementById('ssid').value,
        password: document.getElementById('password').value
    };
    
    const msg = document.getElementById('wifi-msg');
    msg.innerText = "Connecting...";
    msg.className = "success";
    msg.style.display = 'block';
    
    const res = await fetch('/api/wifi', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    const json = await res.json();
    if (res.ok) {
        msg.innerText = json.message;
        msg.className = "success";
    } else {
        msg.innerText = "Failed: " + json.message;
        msg.className = "error";
    }
}
</script>

</body>
</html>
